name: gateway-validation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - name: Install test dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash coreutils findutils grep python3 jq ca-certificates curl tar ufw dnsutils openssl
      - uses: actions/checkout@v4
      - name: Validate repository shell syntax and secret hygiene
        run: ./scripts/validate-repository.sh
      - name: Install pinned sing-box for config acceptance
        run: SING_BOX_VERSION=1.13.18 ./scripts/install-sing-box.sh
      - name: Run supported local validation suite
        run: ./tests/test-local.sh
